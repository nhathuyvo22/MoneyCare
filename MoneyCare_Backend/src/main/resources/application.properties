spring.application.name=MoneyCare

# Cau hinh ket noi MySQL - nho tao database truoc bang lenh: CREATE DATABASE moneycare_db;
# Cau hinh ket noi MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/moneycare_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver



# ddl-auto=update: Hibernate tu tao/cap nhat bang theo Entity, khong xoa du lieu cu
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cho phep field kieu nguyen thuy bi thieu trong JSON duoc mac dinh thay vi loi 400
spring.jackson.deserialization.fail-on-null-for-primitives=false

# Tao cac bang va khoa ngoai tu schema.sql truoc khi Hibernate cap nhat mapping
spring.sql.init.mode=always

# JWT secret is mandatory and must be supplied through the deployment environment.
jwt.secret=${JWT_SECRET:MoneyCareSuperSecretKeyForJwtAuth2026SecureKeyMustBeLongEnoughForHS256Bit}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl